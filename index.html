<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket de venta – Phone SV (dispositivos)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:12px 0 100px;background:#dcdcdc;font-family:-apple-system,Helvetica,Arial,sans-serif}
  /* La vista previa se reduce al ancho del teléfono; el ticket real sigue midiendo 576 px */
  #wrap{margin:0 auto;overflow:hidden}
  #ticket{width:576px;transform-origin:top left;background:#fff;color:#000;padding:22px 20px 30px;
          font-family:"Courier New",Courier,monospace;font-size:23px;line-height:1.28}
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
       padding:14px 12px calc(14px + env(safe-area-inset-bottom));
       background:linear-gradient(to top,#dcdcdc 65%,rgba(220,220,220,0))}
  .bar button{font-size:17px;padding:12px 30px;border:1px solid #bdbdc2;border-radius:999px;
              background:#f4f4f6;color:#222;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .bar button:active{background:#e4e4e8}
  .c{text-align:center}.b{font-weight:700}
  .neg{font-size:38px;font-weight:700;letter-spacing:1px}
  .eslogan{font-size:21px;font-style:italic;font-weight:700;margin:2px 0 6px}
  .sep{border-top:2px dashed #000;margin:12px 0}
  .row{display:flex;justify-content:space-between;gap:10px}
  .row span:first-child{flex:0 0 auto}
  .row span:last-child{text-align:right;word-break:break-word}
  .row.desc span:first-child{flex:1 1 auto;font-weight:700;word-break:break-word}
  .row.desc span:last-child{flex:0 0 auto}
  .big{font-size:34px;font-weight:700}
  .small{font-size:19px}
  .legal{font-size:16px;line-height:1.25;margin-top:8px}
  .tag{display:inline-block;border:2px solid #000;padding:0 10px;font-weight:700;margin-bottom:6px}
  @media print{
    @page{size:80mm auto;margin:0}
    body{background:#fff;padding:0}.bar{display:none}
    #wrap{width:auto!important;height:auto!important;overflow:visible}
    #ticket{transform:none!important;width:72mm;padding:3mm;font-size:3.1mm}
    .neg{font-size:5mm}.big{font-size:4.4mm}.small{font-size:2.5mm}
    .eslogan{font-size:2.8mm}.legal{font-size:2.2mm}
  }
</style>
</head>
<body>
<div id="wrap"><div id="ticket"></div></div>
<div class="bar"><button id="btnPng">🖨️ Imprimir</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ============ CONFIGURACIÓN ============ */
const NEGOCIO = {
  nombre:   'PHONE SV',
  eslogan:  '¡Tu mejor opción en calidad, precio y garantía!',
  direccion:'Plaza Comercial Pasares, Km 35 ½ Opico, Local H5, La Libertad Centro, La Libertad, El Salvador',
  tel:      'WhatsApp: 6064-3493'
};
const MONEDA = '$';
const PIE = 'Gracias por su compra';
const LEGAL = 'Este ticket no sustituye su factura electrónica, enviada a su correo o WhatsApp.';
/* ======================================= */

/* Parámetros de URL = columnas de AppSheet:
   IMEI, Telefono, Nombre, Nombre_Vendedor, Fecha_Venta, TipoModelo, Modelo, Capacidad, Color,
   Estado_Dispositivo, Precio_Venta, Costo_Envio, Total, Tipo_Pago */
const q = new URLSearchParams(location.search);
const hayDatos = [...q.keys()].length > 0;
const get = k => (q.get(k) || '').trim();

const DEMO = {
  IMEI:'356938035643809', Telefono:'7000-0000', Nombre:'Cliente de prueba', Nombre_Vendedor:'Jairo', Fecha_Venta:'17/10/2026',
  TipoModelo:'Celular', Modelo:'iPhone 13', Capacidad:'128 GB', Color:'Medianoche', Estado_Dispositivo:'Usado',
  Precio_Venta:'420', Costo_Envio:'3.50', Total:'423.50', Tipo_Pago:'Efectivo'
};
const D = hayDatos ? Object.fromEntries([...q.keys()].map(k => [k, get(k)])) : DEMO;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = s => {
  let t = String(s ?? '').replace(/[^0-9.,-]/g, '');
  t = t.includes('.') ? t.replace(/,/g, '') : t.replace(',', '.');   // "1,200.50" y "12,5"
  const n = parseFloat(t); return isNaN(n) ? 0 : n;
};
const money = n => MONEDA + n.toFixed(2);
const line = (a, b) => b ? `<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>` : '';

/* Fecha de venta: AppSheet la manda como mes/día/año (o aaaa-mm-dd); se muestra día/mes/año */
function fechaVenta(v){
  const t = String(v || '').trim(); if (!t) return '';
  const p2 = n => String(n).padStart(2, '0');
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${p2(m[3])}/${p2(m[2])}/${m[1]}`;
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return t;
  let a = +m[1], b = +m[2];
  if (a > 12) return `${p2(a)}/${p2(b)}/${m[3]}`;      // ya viene día/mes/año
  return `${p2(b)}/${p2(a)}/${m[3]}`;                  // mes/día/año -> día/mes/año
}

/* Fecha y hora de emisión del ticket, 24 h */
function fechaTxt(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function render(){
  const cap = (D.Capacidad || '').trim();
  const descripcion = (D.Modelo || '') + (cap && cap !== '-' ? ' ' + cap : '');
  const precio = num(D.Precio_Venta);
  const envio = num(D.Costo_Envio);
  const total = D.Total !== undefined && D.Total !== '' ? num(D.Total) : precio + envio;

  let h = '';
  h += `<div class="c"><div class="neg">${esc(NEGOCIO.nombre)}</div>`;
  h += `<div class="eslogan">${esc(NEGOCIO.eslogan)}</div>`;
  h += `<div class="small">${esc(NEGOCIO.direccion)}</div><div class="small">${esc(NEGOCIO.tel)}</div></div>`;
  h += `<div class="sep"></div>`;

  h += `<div class="c"><span class="tag">TICKET DE VENTA</span><div class="b">DISPOSITIVOS</div></div>`;
  h += `<div class="sep"></div>`;
  h += line('Ticket:', D.IMEI);
  h += line('Fecha de venta:', fechaVenta(D.Fecha_Venta));
  h += line('Cliente:', D.Nombre);
  h += line('Tel:', D.Telefono);
  h += line('Asistente:', D.Nombre_Vendedor);

  h += `<div class="sep"></div><div class="row b"><span>DESCRIPCIÓN</span><span>IMPORTE</span></div><div class="sep" style="margin:6px 0"></div>`;
  h += `<div class="b" style="word-break:break-word">${esc(descripcion)}</div>`;
  h += `<div class="row"><span>1 x ${money(precio)}</span><span>${money(precio)}</span></div>`;

  h += `<div class="sep"></div><div class="b c">DATOS DEL EQUIPO</div>`;
  h += line('Tipo:', D.TipoModelo);
  h += line('Equipo:', D.Modelo);
  h += line('Capacidad:', cap);
  h += line('Color:', D.Color);
  h += line('Estado:', D.Estado_Dispositivo);

  h += `<div class="sep"></div>`;
  h += line('Subtotal:', money(precio));
  h += line('Envío:', money(envio));
  h += `<div class="row big"><span>TOTAL:</span><span>${money(total)}</span></div>`;

  h += `<div class="sep"></div>`;
  h += line('Pago:', D.Tipo_Pago);

  h += `<div class="sep"></div><div class="c b">${esc(PIE)}</div>`;
  h += `<div class="c legal">${esc(LEGAL)}</div>`;
  h += `<div class="c legal" style="margin-top:4px">Emitido: ${fechaTxt()}</div>`;
  document.getElementById('ticket').innerHTML = h;
}
render();

/* Ajuste de la vista previa al ancho de la pantalla */
function fit(){
  const t = document.getElementById('ticket'), w = document.getElementById('wrap');
  const k = Math.min(1, (window.innerWidth - 24) / 576);
  t.style.transform = `scale(${k})`;
  w.style.width  = (576 * k) + 'px';
  w.style.height = (t.offsetHeight * k) + 'px';
}
fit();
window.addEventListener('resize', fit);
window.addEventListener('load', fit);

/* ================= Imprimir por Bluetooth (NETUM, ESC/POS) =================
   - Chrome (Mac/Android/Windows) y Bluefy (iPhone/iPad): conecta, imprime, corta y suelta la impresora.
   - Safari / Chrome en iPhone: el botón abre este mismo ticket en Bluefy.
   - Otros navegadores sin Bluetooth: comparte/descarga el PNG como antes. */
const BLE = (() => {
  const SERVICIOS = [
    '000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb',
    '0000ffe0-0000-1000-8000-00805f9b34fb', '0000ae30-0000-1000-8000-00805f9b34fb',
    '0000fee7-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455'
  ];
  const ANCHO = 576, TROZO = 180, PAUSA = 5;   // 72 mm a 203 dpi; velocidad probada
  const espera = ms => new Promise(r => setTimeout(r, ms));

  async function canal(dev) {
    const srv = await dev.gatt.connect();
    for (const s of await srv.getPrimaryServices())
      for (const c of await s.getCharacteristics())
        if (c.properties.write || c.properties.writeWithoutResponse)
          return { c, sinResp: !c.properties.write };
    throw new Error('No encontré el canal de la impresora.');
  }

  async function enviar(ch, bytes) {
    for (let i = 0; i < bytes.length; i += TROZO) {
      const p = bytes.slice(i, i + TROZO);
      if (ch.sinResp) { await ch.c.writeValueWithoutResponse(p); await espera(PAUSA); }
      else await ch.c.writeValue(p);
    }
  }

  // Canvas -> ESC/POS raster; las filas en blanco solo avanzan papel
  function raster(src) {
    const alto = Math.round(src.height * ANCHO / src.width);
    const cv = document.createElement('canvas'); cv.width = ANCHO; cv.height = alto;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, ANCHO, alto);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, ANCHO, alto);
    const px = ctx.getImageData(0, 0, ANCHO, alto).data, bpl = ANCHO / 8, out = [], filas = [];
    for (let y = 0; y < alto; y++) {
      const f = new Uint8Array(bpl); let vacia = true;
      for (let xb = 0; xb < bpl; xb++) {
        let b = 0;
        for (let bit = 0; bit < 8; bit++) {
          const i = (y * ANCHO + xb * 8 + bit) * 4;
          if (px[i + 3] > 128 && 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2] < 175) b |= 0x80 >> bit;
        }
        f[xb] = b; if (b) vacia = false;
      }
      filas.push({ f, vacia });
    }
    // Todas las filas (también las blancas) van como imagen: así la altura sale exacta
    for (let ini = 0; ini < alto; ini += 200) {
      const h = Math.min(200, alto - ini);
      out.push(0x1D, 0x76, 0x30, 0x00, bpl & 255, bpl >> 8, h & 255, h >> 8);
      for (let k = ini; k < ini + h; k++) for (const b of filas[k].f) out.push(b);
    }
    return new Uint8Array(out);
  }

  async function imprimir(hacerCanvas, avisar) {
    // La lista de impresoras se abre de inmediato (el navegador exige que sea justo después del toque)
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: SERVICIOS });
    avisar('Preparando ticket…');
    const datos = raster(await hacerCanvas());
    avisar('Conectando…');
    let ch;
    try { ch = await canal(dev); }
    catch (e) { throw new Error('No se pudo conectar. ¿Está encendida o la está usando otro equipo?'); }
    try {
      avisar('Imprimiendo…');
      await enviar(ch, new Uint8Array([0x1B, 0x40]));                          // ESC @
      await enviar(ch, datos);
      await enviar(ch, new Uint8Array([0x1B, 0x64, 0x04, 0x1D, 0x56, 0x42, 0x00])); // avanzar + cortar
      await espera(300);
    } finally {
      try { dev.gatt.disconnect(); } catch (e) {}       // suelta la impresora
    }
  }

  const hayBluetooth = !!navigator.bluetooth;
  const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const abrirEnBluefy = () => { location.href = 'bluefy://open?url=' + encodeURIComponent(location.href); };

  return { imprimir, hayBluetooth, esIOS, abrirEnBluefy };
})();

/* Botón Imprimir */
(() => {
  const btn = document.getElementById('btnPng');
  const textoOriginal = btn.textContent;
  const aviso = document.createElement('div');
  aviso.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));' +
    'text-align:center;font-size:15px;color:#222;pointer-events:none';
  document.body.appendChild(aviso);
  const avisar = (t, ms) => { aviso.textContent = t || ''; if (ms) setTimeout(() => { if (aviso.textContent === t) aviso.textContent = ''; }, ms); };

  if (!BLE.hayBluetooth && BLE.esIOS) {
    btn.textContent = '🖨️ Abrir en Bluefy';
    BLE.abrirEnBluefy();   // salto automático; si falla, queda el botón
  }

  async function canvasDelTicket(escala) {
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;left:-10000px;top:0;width:576px';
    const clone = document.getElementById('ticket').cloneNode(true);
    clone.style.transform = 'none';
    holder.appendChild(clone); document.body.appendChild(holder);
    try { return await html2canvas(clone, { scale: escala, backgroundColor: '#ffffff', windowWidth: 576, scrollX: 0, scrollY: 0 }); }
    finally { holder.remove(); }
  }

  let ocupado = false;
  btn.addEventListener('click', async () => {
    if (ocupado) return;

    // iPhone/iPad fuera de Bluefy -> abrir el mismo ticket en Bluefy
    if (!BLE.hayBluetooth && BLE.esIOS) { BLE.abrirEnBluefy(); return; }

    // Sin Bluetooth (p. ej. Safari en Mac) -> compartir/descargar PNG como antes
    if (!BLE.hayBluetooth) {
      const canvas = await canvasDelTicket(2);
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const file = new File([blob], (document.title || 'ticket').replace(/[^\w-]+/g, '-') + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch (e) {} }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
      return;
    }

    ocupado = true; btn.disabled = true; btn.textContent = '⏳ Imprimiendo…';
    try {
      await BLE.imprimir(() => canvasDelTicket(2), avisar);
      avisar('✅ Impreso', 3000);
    } catch (e) {
      if (e && e.name === 'NotFoundError') avisar('');                    // canceló la lista
      else avisar('⚠️ ' + (e && e.message ? e.message : 'No se pudo imprimir'), 6000);
    } finally {
      ocupado = false; btn.disabled = false; btn.textContent = textoOriginal;
    }
  });
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
